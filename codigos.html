<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Códigos - VidSpri</title>
    <script src="config.js"></script>
    <script src="translations.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="logo.png" type="image/png">

    <!-- Social Media Metadata -->
    <meta property="og:title" content="Códigos - VidSpri">
    <meta property="og:description" content="VidSpri: Crea hojas de sprites y animaciones para tus videojuegos en segundos">
    <meta property="og:image" content="https://vidspri.online/logo.png">
    <meta property="og:url" content="https://vidspri.online/codigos.html">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Códigos - VidSpri">
    <meta name="twitter:description" content="VidSpri: Crea hojas de sprites y animaciones para tus videojuegos en segundos">
    <meta name="twitter:image" content="https://vidspri.online/logo.png">
    <!-- End Social Media Metadata -->
</head>
<body>
    <div class="header-actions">
        <button type="button" onclick="window.location.href='index.html'" class="pill-btn">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-arrow-left"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
            <span data-i18n="back">Volver</span>
        </button>
    </div>

    <div class="container">
        <h1 data-i18n="codes_title">Códigos Prioritarios</h1>

        <div id="codes-container" class="modern-card">
            <h3 data-i18n="priority_codes">🎁 Códigos Gratuitos</h3>
            <p class="small-text" data-i18n="codes_sub">Copia uno para procesar más rápido. Se regeneran cada 24h.</p>
            <div id="priority-codes-list" class="codes-grid">
                <div class="loading-spinner"></div>
            </div>
        </div>

        <div class="modern-card redeem-card">
            <h3 data-i18n="redeem_code">Canjear Código</h3>
            <p data-i18n="priority_sub">Introduce tu código de acceso para obtener un procesamiento prioritario.</p>
            <div class="form-group">
                <input type="text" id="priority-code-input" placeholder="..." maxlength="12">
            </div>
            <button type="button" id="save-priority-code-btn" class="action-btn" data-i18n="activate">Activar Prioridad</button>
            <p id="priority-status" style="margin-top: 1rem; font-weight: bold; min-height: 1.5rem;"></p>
        </div>
    </div>

    <div id="toast-container"></div>

    <script>
        const supabaseClient = supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_KEY);

        let userId = localStorage.getItem('vidspri_user_id') || crypto.randomUUID();
        localStorage.setItem('vidspri_user_id', userId);

        document.addEventListener('DOMContentLoaded', () => {
            const currentLang = localStorage.getItem('vidspri_lang') || 'es';
            applyTranslations(currentLang);
            loadPriorityCodes();
            checkStatus();

            document.getElementById('save-priority-code-btn').onclick = async () => {
                const btn = document.getElementById('save-priority-code-btn');
                const code = document.getElementById('priority-code-input').value.trim();
                if (!code) return;

                btn.disabled = true;
                btn.textContent = '...';

                const { data, error } = await supabaseClient.rpc('redeem_priority_code', {
                    user_id_param: userId,
                    code_param: code
                });

                if (error) {
                    showToast(error.message, 'error', true);
                } else if (!data.success) {
                    showToast(data.message, 'error');
                } else {
                    showToast('priority_active', 'success');
                    checkStatus();
                    loadPriorityCodes();
                }

                btn.disabled = false;
                applyTranslations(localStorage.getItem('vidspri_lang') || 'es');
            };
        });

        async function loadPriorityCodes() {
            const codesList = document.getElementById('priority-codes-list');
            try {
                const { data, error } = await supabaseClient
                    .from('priority_codes')
                    .select('*')
                    .eq('is_auto', true)
                    .eq('is_used', false)
                    .order('created_at', { ascending: false });

                if (error) throw error;

                codesList.innerHTML = '';
                data.slice(0, 10).forEach(code => {
                    const codeEl = document.createElement('div');
                    codeEl.className = 'code-item';
                    codeEl.textContent = code.code;
                    codeEl.onclick = () => {
                        document.getElementById('priority-code-input').value = code.code;
                        navigator.clipboard.writeText(code.code);
                        showToast('copy_success', 'success');
                    };
                    codesList.appendChild(codeEl);
                });
            } catch (e) {
                codesList.innerHTML = 'Error al cargar códigos';
            }
        }

        async function checkStatus() {
            const { data, error } = await supabaseClient
                .from('user_priorities')
                .select('*')
                .eq('user_id', userId)
                .single();

            const statusEl = document.getElementById('priority-status');
            const dict = window.translations[localStorage.getItem('vidspri_lang') || 'es'];

            if (data) {
                const hasTimePriority = data.priority_until && new Date(data.priority_until) > new Date();
                if (hasTimePriority) {
                    statusEl.textContent = dict['priority_active'];
                    statusEl.style.color = '#00f2ff';
                } else if (data.remaining_uses > 0) {
                    statusEl.textContent = (dict['priority_uses'] || 'Uses: ') + data.remaining_uses;
                    statusEl.style.color = '#00f2ff';
                } else {
                    statusEl.textContent = '';
                }
            } else {
                statusEl.textContent = '';
            }
        }

        function applyTranslations(lang) {
            const dict = window.translations[lang] || window.translations['es'];
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (dict[key]) el.textContent = dict[key];
            });
        }

        function showToast(messageKey, type = 'info', isLiteral = false) {
            const dict = window.translations[localStorage.getItem('vidspri_lang') || 'es'];
            const message = isLiteral ? messageKey : (dict[messageKey] || messageKey);
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.textContent = message;
            document.getElementById('toast-container').appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }
    </script>
</body>
</html>
