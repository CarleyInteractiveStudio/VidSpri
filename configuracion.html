<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configuración - VidSpri</title>
    <script src="config.js"></script>
    <script src="translations.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="logo.png" type="image/png">
</head>
<body>
    <div class="header-actions">
        <button type="button" onclick="window.location.href='index.html'" class="pill-btn">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-arrow-left"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
            <span data-i18n="back">Volver</span>
        </button>
    </div>

    <div class="container">
        <h1 data-i18n="config_title">Configuración</h1>

        <div class="modern-card">
            <h3 data-i18n="account">Cuenta</h3>
            <div id="auth-section">
                <button type="button" id="login-btn" class="action-btn">
                    <span data-i18n="login">Iniciar Sesión</span>
                </button>
                <div id="user-info" class="hidden">
                    <div id="welcome-msg" class="welcome-banner" style="margin-bottom: 1.5rem;">
                        <span data-i18n="welcome">Bienvenido</span>, <strong id="welcome-name"></strong>
                    </div>
                    <p style="margin-bottom: 1rem;"><span data-i18n="logged_as">Identificado como:</span> <strong id="user-email"></strong></p>
                    <button type="button" id="logout-btn" class="pill-btn" style="margin: 0 auto;">Cerrar Sesión</button>
                </div>
            </div>
        </div>

        <div class="modern-card">
            <h3 data-i18n="priority_access">Más configuraciones</h3>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
                <button type="button" onclick="window.location.href='codigos.html'" class="pill-btn" data-i18n="go_to_redeem" style="height: 46px; width: 100%; justify-content: center;">Canjear Código</button>
                <button type="button" id="open-lang-modal" class="pill-btn" style="height: 46px; width: 100%; justify-content: center;">
                    <span id="current-lang-name">Español</span>
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-globe"><circle cx="12" cy="12" r="10"></circle><line x1="2" y1="12" x2="22" y2="12"></line><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path></svg>
                </button>

                <button type="button" onclick="window.location.href='ayuda.html'" class="pill-btn" style="height: 46px; width: 100%; justify-content: center;">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-help-circle"><circle cx="12" cy="12" r="10"></circle><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>
                    <span data-i18n="help">Ayuda</span>
                </button>
                <button type="button" onclick="window.location.href='privacidad.html'" class="pill-btn" style="height: 46px; width: 100%; justify-content: center;">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-shield"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
                    <span data-i18n="privacy">Privacidad</span>
                </button>

                <button type="button" onclick="window.location.href='https://carleystudio.com/vid-spri.html#donations'" class="pill-btn highlight-btn" style="height: 46px; width: 100%; justify-content: center;">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-heart"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>
                    <span data-i18n="support">Donar</span>
                </button>
                <button type="button" onclick="window.location.href='https://carleystudio.com/vid-spri.html#claims'" class="pill-btn" style="height: 46px; width: 100%; justify-content: center;">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-alert-circle"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
                    <span data-i18n="claims">Reclamaciones</span>
                </button>

                <button type="button" onclick="window.location.href='https://carleystudio.com/vid-spri.html#credits'" class="pill-btn" style="height: 46px; width: 100%; justify-content: center; grid-column: span 2;">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-users"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
                    <span data-i18n="credits">Créditos</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Language Modal -->
    <div id="lang-modal" class="modal hidden">
        <div class="modal-content">
            <h2 data-i18n="language">Idioma</h2>
            <div class="lang-grid-large">
                <button class="lang-opt-large" data-lang="es">Español</button>
                <button class="lang-opt-large" data-lang="en">English</button>
                <button class="lang-opt-large" data-lang="fr">Français</button>
                <button class="lang-opt-large" data-lang="pt">Português</button>
                <button class="lang-opt-large" data-lang="it">Italiano</button>
                <button class="lang-opt-large" data-lang="de">Deutsch</button>
                <button class="lang-opt-large" data-lang="jp">日本語</button>
                <button class="lang-opt-large" data-lang="zh">中文</button>
                <button class="lang-opt-large" data-lang="ru">Русский</button>
                <button class="lang-opt-large" data-lang="ko">한국어</button>
                <button class="lang-opt-large" data-lang="ar">العربية</button>
                <button class="lang-opt-large" data-lang="hi">हिन्दी</button>
                <button class="lang-opt-large" data-lang="tr">Türkçe</button>
                <button class="lang-opt-large" data-lang="nl">Nederlands</button>
                <button class="lang-opt-large" data-lang="pl">Polski</button>
                <button class="lang-opt-large" data-lang="vi">Tiếng Việt</button>
                <button class="lang-opt-large" data-lang="th">ไทย</button>
                <button class="lang-opt-large" data-lang="id">Bahasa Indonesia</button>
                <button class="lang-opt-large" data-lang="ms">Bahasa Melayu</button>
            </div>
            <button type="button" id="close-lang-modal" class="pill-btn" style="margin: 20px auto 0;" data-i18n="close">Cerrar</button>
        </div>
    </div>

    <!-- SSO Bridge -->
    <iframe id="sso-bridge" src="https://carleystudio.com/bridge.html" style="display:none;"></iframe>

    <script>
        // Minimal logic for the config page
        document.addEventListener('DOMContentLoaded', () => {
            const bridgeIframe = document.getElementById('sso-bridge');

            function requestSessionCheck() {
                if (bridgeIframe && bridgeIframe.contentWindow) {
                    bridgeIframe.contentWindow.postMessage({
                        type: 'CHECK_SESSION'
                    }, 'https://carleystudio.com');
                }
            }

            if (bridgeIframe) {
                bridgeIframe.onload = requestSessionCheck;
            }

            const currentLang = localStorage.getItem('vidspri_lang') || 'es';
            const langNames = {
                es: "Español", en: "English", fr: "Français", pt: "Português",
                it: "Italiano", de: "Deutsch", jp: "日本語", zh: "中文",
                ru: "Русский", ko: "한국어", ar: "العربية", hi: "हिन्दी",
                tr: "Türkçe", nl: "Nederlands", pl: "Polski", vi: "Tiếng Việt",
                th: "ไทย", id: "Bahasa Indonesia", ms: "Bahasa Melayu"
            };

            document.getElementById('current-lang-name').textContent = langNames[currentLang] || "Español";
            applyTranslations(currentLang);

            // SSO and Auth logic
            const loginBtn = document.getElementById('login-btn');
            const logoutBtn = document.getElementById('logout-btn');
            const userInfo = document.getElementById('user-info');
            const userEmailEl = document.getElementById('user-email');

            window.addEventListener('message', (event) => {
                if (event.origin !== 'https://carleystudio.com') return;

                if (event.data.type === 'BRIDGE_READY') {
                    requestSessionCheck();
                }

                if (event.data.type === 'SESSION_RESPONSE') {
                    const session = event.data.payload;
                    if (session && session.user) {
                        const user = session.user;
                        loginBtn.classList.add('hidden');
                        userInfo.classList.remove('hidden');

                        const meta = user.user_metadata || {};
                        const displayName = meta.username || meta.display_name || meta.full_name || user.email || user.id;

                        userEmailEl.textContent = displayName;
                        document.getElementById('welcome-name').textContent = displayName;
                        localStorage.setItem('vidspri_user_id', user.id);
                        localStorage.setItem('vidspri_user_name', displayName);
                    } else {
                        // Only show login button if we don't have a locally saved user
                        const savedName = localStorage.getItem('vidspri_user_name');
                        if (!savedName) {
                            loginBtn.classList.remove('hidden');
                            userInfo.classList.add('hidden');
                        }
                    }
                }
            });

            const savedName = localStorage.getItem('vidspri_user_name');
            if (savedName) {
                userEmailEl.textContent = savedName;
                document.getElementById('welcome-name').textContent = savedName;
            }

            // Capture SSO token from URL hash
            const hash = window.location.hash.substring(1);
            const params = new URLSearchParams(hash);
            const token = params.get('sso_token');
            const userIdFromHash = params.get('user_id');

            if (token) {
                console.log("¡Sesión iniciada con éxito!");
                localStorage.setItem('vidspri_sso_token', token);
                if (userIdFromHash) {
                    localStorage.setItem('vidspri_user_id', userIdFromHash);
                }
                window.location.hash = ""; // Clean URL

                // Show UI immediately if we have a name
                const savedName = localStorage.getItem('vidspri_user_name');
                if (savedName) {
                    loginBtn.classList.add('hidden');
                    userInfo.classList.remove('hidden');
                }

                requestSessionCheck();
            }

            loginBtn.onclick = () => {
                const domain = "carleyinteractivestudio.github.io";
                const redirectTo = window.location.href.split('#')[0];
                window.location.href = `https://carleystudio.com/sso.html?domain=${domain}&redirect_to=${encodeURIComponent(redirectTo)}`;
            };

            logoutBtn.onclick = () => {
                localStorage.removeItem('vidspri_user_id');
                localStorage.removeItem('vidspri_user_name');
                localStorage.removeItem('vidspri_sso_token');
                location.reload();
            };

            // Modal Logic
            const modal = document.getElementById('lang-modal');
            const openBtn = document.getElementById('open-lang-modal');
            const closeBtn = document.getElementById('close-lang-modal');

            openBtn.onclick = () => modal.classList.remove('hidden');
            closeBtn.onclick = () => modal.classList.add('hidden');
            window.onclick = (e) => { if (e.target == modal) modal.classList.add('hidden'); };

            // Language Selection
            document.querySelectorAll('.lang-opt-large').forEach(btn => {
                btn.onclick = () => {
                    const lang = btn.getAttribute('data-lang');
                    localStorage.setItem('vidspri_lang', lang);
                    applyTranslations(lang);
                    document.getElementById('current-lang-name').textContent = langNames[lang];
                    modal.classList.add('hidden');

                    document.querySelectorAll('.lang-opt-large').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                };
                if (btn.getAttribute('data-lang') === currentLang) btn.classList.add('active');
            });
        });

        function applyTranslations(lang) {
            const dict = window.translations[lang] || window.translations['es'];
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (dict[key]) {
                    if (el.children.length > 0) {
                        const textNode = Array.from(el.childNodes).find(node => node.nodeType === Node.TEXT_NODE);
                        if (textNode) textNode.textContent = dict[key];
                        else el.appendChild(document.createTextNode(dict[key]));
                    } else {
                        el.textContent = dict[key];
                    }
                }
            });
        }
    </script>
</body>
</html>
