<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configuración - VidSpri</title>
    <script src="config.js"></script>
    <script src="translations.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="logo.png" type="image/png">
</head>
<body>
    <div class="header-actions">
        <button type="button" onclick="window.location.href='index.html'" class="pill-btn">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-arrow-left"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
            <span data-i18n="back">Volver</span>
        </button>
    </div>

    <div class="container">
        <h1 data-i18n="config_title">Configuración</h1>

        <div class="modern-card">
            <h3 data-i18n="account">Cuenta</h3>
            <div id="auth-section">
                <button type="button" id="login-btn" class="action-btn">
                    <span data-i18n="login">Iniciar Sesión</span>
                </button>
                <div id="user-info" class="hidden">
                    <p><span data-i18n="logged_as">Identificado como:</span> <strong id="user-email"></strong></p>
                    <button type="button" id="logout-btn" class="pill-btn" style="margin: 0 auto;">Cerrar Sesión</button>
                </div>
            </div>
        </div>

        <div class="modern-card">
            <h3 data-i18n="priority_access">Acceso Prioritario</h3>
            <p data-i18n="redeem_sub">Canjea un código para obtener una mejor posición en la fila sin afectar a los demás.</p>
            <div style="display: flex; gap: 10px; align-items: center; justify-content: center; flex-wrap: wrap;">
                <button type="button" onclick="window.location.href='codigos.html'" class="pill-btn" data-i18n="go_to_redeem" style="height: 46px; white-space: nowrap; flex: 1; min-width: 140px;">Ir a Canjear</button>
                <button type="button" id="open-lang-modal" class="pill-btn" style="height: 46px; white-space: nowrap; flex: 1; min-width: 140px;">
                    <span id="current-lang-name">Español</span>
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-globe"><circle cx="12" cy="12" r="10"></circle><line x1="2" y1="12" x2="22" y2="12"></line><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path></svg>
                </button>
            </div>
        </div>
    </div>

    <!-- Language Modal -->
    <div id="lang-modal" class="modal hidden">
        <div class="modal-content">
            <h2 data-i18n="language">Idioma</h2>
            <div class="lang-grid-large">
                <button class="lang-opt-large" data-lang="es">Español</button>
                <button class="lang-opt-large" data-lang="en">English</button>
                <button class="lang-opt-large" data-lang="fr">Français</button>
                <button class="lang-opt-large" data-lang="pt">Português</button>
                <button class="lang-opt-large" data-lang="it">Italiano</button>
                <button class="lang-opt-large" data-lang="de">Deutsch</button>
                <button class="lang-opt-large" data-lang="jp">日本語</button>
                <button class="lang-opt-large" data-lang="zh">中文</button>
                <button class="lang-opt-large" data-lang="ru">Русский</button>
                <button class="lang-opt-large" data-lang="ko">한국어</button>
                <button class="lang-opt-large" data-lang="ar">العربية</button>
                <button class="lang-opt-large" data-lang="hi">हिन्दी</button>
                <button class="lang-opt-large" data-lang="tr">Türkçe</button>
                <button class="lang-opt-large" data-lang="nl">Nederlands</button>
                <button class="lang-opt-large" data-lang="pl">Polski</button>
                <button class="lang-opt-large" data-lang="vi">Tiếng Việt</button>
                <button class="lang-opt-large" data-lang="th">ไทย</button>
                <button class="lang-opt-large" data-lang="id">Bahasa Indonesia</button>
                <button class="lang-opt-large" data-lang="ms">Bahasa Melayu</button>
            </div>
            <button type="button" id="close-lang-modal" class="pill-btn" style="margin: 20px auto 0;" data-i18n="close">Cerrar</button>
        </div>
    </div>

    <!-- SSO Bridge -->
    <iframe id="sso-bridge" src="https://carleystudio.com/bridge.html" style="display:none;"></iframe>

    <script>
        // Minimal logic for the config page
        document.addEventListener('DOMContentLoaded', () => {
            const bridgeIframe = document.getElementById('sso-bridge');
            if (bridgeIframe) {
                bridgeIframe.onload = () => {
                    bridgeIframe.contentWindow.postMessage({ type: 'CHECK_SESSION' }, 'https://carleystudio.com');
                };
            }

            const currentLang = localStorage.getItem('vidspri_lang') || 'es';
            const langNames = {
                es: "Español", en: "English", fr: "Français", pt: "Português",
                it: "Italiano", de: "Deutsch", jp: "日本語", zh: "中文",
                ru: "Русский", ko: "한국어", ar: "العربية", hi: "हिन्दी",
                tr: "Türkçe", nl: "Nederlands", pl: "Polski", vi: "Tiếng Việt",
                th: "ไทย", id: "Bahasa Indonesia", ms: "Bahasa Melayu"
            };

            document.getElementById('current-lang-name').textContent = langNames[currentLang] || "Español";
            applyTranslations(currentLang);

            // SSO and Auth logic
            const loginBtn = document.getElementById('login-btn');
            const logoutBtn = document.getElementById('logout-btn');
            const userInfo = document.getElementById('user-info');
            const userEmailEl = document.getElementById('user-email');

            window.addEventListener('message', (event) => {
                if (event.origin !== 'https://carleystudio.com') return;
                if (event.data.type === 'SESSION_RESPONSE') {
                    const user = event.data.payload;
                    if (user) {
                        loginBtn.classList.add('hidden');
                        userInfo.classList.remove('hidden');
                        userEmailEl.textContent = user.email;
                        localStorage.setItem('vidspri_user_id', user.id);
                    }
                }
            });

            // Capture SSO token from URL hash
            const hash = window.location.hash.substring(1);
            const params = new URLSearchParams(hash);
            const token = params.get('sso_token');
            if (token) {
                console.log("¡Sesión iniciada con éxito!");
                localStorage.setItem('vidspri_sso_token', token);

                // Trigger a bridge check to get user details
                if (bridgeIframe && bridgeIframe.contentWindow) {
                    bridgeIframe.contentWindow.postMessage({ type: 'CHECK_SESSION' }, 'https://carleystudio.com');
                }

                // Optional: show a success message immediately
                loginBtn.classList.add('hidden');
                userInfo.classList.remove('hidden');

                window.location.hash = ""; // Clean URL
            }

            loginBtn.onclick = () => {
                const domain = "carleyinteractivestudio.github.io";
                const redirectTo = window.location.href.split('#')[0];
                window.location.href = `https://carleystudio.com/sso.html?domain=${domain}&redirect_to=${encodeURIComponent(redirectTo)}`;
            };

            logoutBtn.onclick = () => {
                // Simplified logout for now
                localStorage.removeItem('vidspri_user_id');
                location.reload();
            };

            // Modal Logic
            const modal = document.getElementById('lang-modal');
            const openBtn = document.getElementById('open-lang-modal');
            const closeBtn = document.getElementById('close-lang-modal');

            openBtn.onclick = () => modal.classList.remove('hidden');
            closeBtn.onclick = () => modal.classList.add('hidden');
            window.onclick = (e) => { if (e.target == modal) modal.classList.add('hidden'); };

            // Language Selection
            document.querySelectorAll('.lang-opt-large').forEach(btn => {
                btn.onclick = () => {
                    const lang = btn.getAttribute('data-lang');
                    localStorage.setItem('vidspri_lang', lang);
                    applyTranslations(lang);
                    document.getElementById('current-lang-name').textContent = langNames[lang];
                    modal.classList.add('hidden');

                    document.querySelectorAll('.lang-opt-large').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                };
                if (btn.getAttribute('data-lang') === currentLang) btn.classList.add('active');
            });
        });

        function applyTranslations(lang) {
            const dict = window.translations[lang] || window.translations['es'];
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (dict[key]) {
                    if (el.children.length > 0) {
                        const textNode = Array.from(el.childNodes).find(node => node.nodeType === Node.TEXT_NODE);
                        if (textNode) textNode.textContent = dict[key];
                        else el.appendChild(document.createTextNode(dict[key]));
                    } else {
                        el.textContent = dict[key];
                    }
                }
            });
        }
    </script>
</body>
</html>
