<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Extraer Fotogramas - VidSpri</title>
    <script src="config.js"></script>
    <script src="translations.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="logo.png" type="image/png">
</head>
<body>
    <div class="header-actions">
        <button type="button" onclick="window.location.href='index.html'" class="pill-btn">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-arrow-left"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
            <span data-i18n="back">Volver</span>
        </button>
    </div>

    <div class="container">
        <h1>
            <img src="logo.png" alt="VidSpri Logo" class="logo">
            <span data-i18n="gen_video">Generar Sprite a partir de Video</span>
        </h1>

        <!-- Stepper -->
        <div id="stepper-container" class="stepper">
            <div class="step active" data-step="1">
                <div class="step-icon"></div>
                <span data-i18n="step_upload">Subir</span>
            </div>
            <div class="step-connector"></div>
            <div class="step" data-step="2">
                <div class="step-icon"></div>
                <span data-i18n="step_edit">Editar</span>
            </div>
            <div class="step-connector"></div>
            <div class="step" data-step="3">
                <div class="step-icon"></div>
                <span data-i18n="step_process">Procesar</span>
            </div>
        </div>

        <!-- Step 1: Upload -->
        <section id="video-section">
            <h2 data-i18n="step_upload">Subir Video</h2>
            <div id="drag-drop-area-video" class="drag-drop-area">
                <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-upload-cloud"><polyline points="16 16 12 12 8 16"></polyline><line x1="12" y1="12" x2="12" y2="21"></line><path d="M20.39 18.39A5 5 0 0 0 18 9h-1.26A8 8 0 1 0 3 16.3"></path></svg>
                <p id="file-status" data-i18n="drag_drop">Arrastra y suelta tu video aquí o haz clic</p>
                <button type="button" id="custom-file-btn" class="pill-btn" data-i18n="choose_file">Seleccionar Archivo</button>
                <input type="file" id="video-file" name="video_file" accept="video/*" class="hidden" required>
            </div>
        </section>

        <!-- Step 2: Edit -->
        <section id="editor-section" class="hidden">
            <h2 data-i18n="step_edit">Editar Video</h2>
            <div class="video-editor-container">
                <div class="video-wrapper">
                    <video id="video-preview"></video>
                    <div id="timeline-marker" class="timeline-marker"></div>
                </div>

                <div class="timeline-container">
                    <div id="thumbnails-track" class="thumbnails-track"></div>
                    <div id="range-selector" class="range-selector">
                        <div class="range-handle left" id="handle-start"></div>
                        <div class="range-highlight"></div>
                        <div class="range-handle right" id="handle-end"></div>
                    </div>
                </div>

                <div class="editor-controls">
                    <div class="control-group">
                        <input type="checkbox" id="manual-input-toggle">
                        <label for="manual-input-toggle">Entrada manual de segundos</label>
                    </div>
                    <div id="manual-time-inputs" class="hidden time-range-grid">
                        <div class="time-input-group">
                            <label for="start-time">Inicio (s)</label>
                            <input type="number" id="start-time" step="0.1" value="0">
                        </div>
                        <div class="time-input-group">
                            <label for="end-time">Fin (s)</label>
                            <input type="number" id="end-time" step="0.1">
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="frames" data-i18n="step2_frames">2. Elige el número de fotogramas:</label>
                        <input type="number" id="frames" name="frames" min="1" max="12" value="12" required>
                    </div>
                </div>

                <button type="button" id="extract-frames-btn" class="action-btn" data-i18n="extract_btn">Extraer Fotogramas 📸</button>
            </div>
        </section>

        <!-- Step 3: Process -->
        <section id="frame-preview-container" class="hidden">
            <h2 data-i18n="step_process">Quitar Fondo</h2>
            <div id="frames-output"></div>
            <button type="button" id="generate-sprite-btn" class="action-btn" data-i18n="process_btn">Quitar Fondo y Generar Sprite ✨</button>
        </section>

        <section id="progress-container" class="hidden">
            <p id="progress-text" data-i18n="processing">Procesando...</p>
            <div id="eta-text" class="small-text" style="margin-top: 5px; opacity: 0.8;"></div>
            <div class="progress-bar">
                <div id="progress-bar-inner"></div>
            </div>
        </section>

        <section id="result-container" class="hidden">
            <h2 data-i18n="done">¡Listo!</h2>
            <img id="sprite-image" src="" alt="Sprite Sheet">
            <div class="result-actions">
                <a id="download-link" href="" download="sprite.png" class="action-btn" style="text-decoration:none;">Descargar</a>
                <button type="button" onclick="location.reload()" class="pill-btn">Procesar otro</button>
            </div>
        </section>
    </div>

    <div id="toast-container"></div>
    <iframe id="sso-bridge" src="https://carleystudio.com/bridge.html" style="display:none;"></iframe>

    <script src="script-extraer.js"></script>
    <footer>
        <div class="footer-links">
            <a href="https://www.facebook.com/profile.php?id=61575555791348" target="_blank" data-i18n="community">Comunidad</a>
            <a href="https://carleystudio.com/vid-spri.html#donations" target="_blank" data-i18n="support">Apoyar</a>
            <a href="creditos.html" data-i18n="credits">Créditos</a>
            <a href="privacidad.html" data-i18n="privacy">Privacidad</a>
        </div>
        <div class="copyright">
            © 2026 Carley Interactive Studio.
        </div>
    </footer>
</body>
</html>
