<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VidSpri - Historial</title>
    <script src="config.js"></script>
    <script src="translations.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="logo.png" type="image/png">
    <style>
        .history-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 2rem;
        }
        .history-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            transition: transform 0.2s, background 0.2s;
        }
        .history-card:hover {
            background: rgba(255, 255, 255, 0.08);
            transform: translateY(-5px);
        }
        .history-preview {
            width: 100%;
            height: 150px;
            background: rgba(0,0,0,0.2);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .history-preview img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            image-rendering: -webkit-optimize-contrast;
            image-rendering: -moz-crisp-edges;
            image-rendering: -o-crisp-edges;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            -ms-interpolation-mode: nearest-neighbor;
        }
        .history-info {
            font-size: 0.9rem;
            opacity: 0.8;
        }
        .history-actions {
            display: flex;
            gap: 10px;
            margin-top: auto;
        }
        .history-btn {
            flex: 1;
            padding: 8px;
            font-size: 0.8rem;
        }
        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
            opacity: 0.6;
        }
        .tab-container {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            justify-content: center;
        }
        .tab-btn {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            color: white;
            padding: 8px 20px;
            border-radius: 20px;
            cursor: pointer;
            transition: 0.2s;
        }
        .tab-btn.active {
            background: var(--primary-color);
            border-color: var(--primary-color);
            box-shadow: 0 0 15px var(--primary-color);
        }
    </style>
</head>
<body>
    <div class="header-actions">
        <button type="button" onclick="window.location.href='index.html'" class="pill-btn">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
            <span data-i18n="back">Volver</span>
        </button>
    </div>

    <div class="container">
        <h1>
            <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: middle; margin-right: 10px;"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
            <span data-i18n="history">Historial</span>
        </h1>

        <div class="tab-container">
            <button class="tab-btn active" onclick="switchTab('sprite')">Sprites</button>
            <button class="tab-btn" onclick="switchTab('audio')">Audio</button>
        </div>

        <div id="history-grid" class="history-container">
            <!-- Items populated by JS -->
        </div>

        <div id="empty-msg" class="empty-state hidden">
            <p data-i18n="no_notifications">No hay elementos en el historial</p>
        </div>
    </div>

    <div id="toast-container"></div>
    <iframe id="sso-bridge" src="https://carleystudio.com/bridge.html" style="display:none;"></iframe>

    <script src="script.js"></script>
    <script src="script-historial.js"></script>
</body>
</html>
