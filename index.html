<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VidSpri - Video to Sprite</title>
    <meta name="description" content="VidSpri: Crea hojas de sprites y animaciones para tus videojuegos en segundos">

    <script src="config.js"></script>
    <script src="translations.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="logo.png" type="image/png">
</head>
<body>
    <div class="header-actions">
        <button type="button" onclick="window.location.href='ayuda.html'" class="pill-btn">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-help-circle"><circle cx="12" cy="12" r="10"></circle><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>
            <span data-i18n="help">Ayuda</span>
        </button>
        <div class="header-right-controls" style="display: flex; gap: 10px;">
            <button type="button" id="notif-btn" class="pill-btn">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-bell"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
                <span class="notif-badge hidden"></span>
            </button>
            <button type="button" onclick="window.location.href='configuracion.html'" class="pill-btn">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-settings"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
                <span data-i18n="config">Configuración</span>
            </button>
        </div>
    </div>

    <div class="container">
        <h1>
            <img src="logo.png" alt="VidSpri Logo" class="logo">
            <span data-i18n="title">VidSpri</span>
        </h1>
        <p data-i18n="subtitle">Convierte tus videos de animaciones en hojas de sprites listas para usar.</p>
        <div id="welcome-msg" class="welcome-banner hidden">
            <span data-i18n="welcome">Bienvenido</span>, <strong id="welcome-name"></strong>
        </div>

        <!-- Main Menu -->
        <section id="main-menu">
            <div class="main-menu-grid">
                <button type="button" onclick="window.location.href='extraer.html'" class="menu-card">
                    <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="2" y="4" width="14" height="12" rx="2"></rect>
                        <path d="M16 8l6-4v12l-6-4"></path>
                        <path d="M10 12l4 4-4 4" transform="translate(6, 0) scale(0.6)"></path>
                        <rect x="15" y="14" width="7" height="7" rx="1" stroke-dasharray="2 2"></rect>
                    </svg>
                    <span data-i18n="gen_video">Generar Sprite a partir de Video</span>
                </button>
                <button type="button" onclick="window.location.href='animacion.html'" class="menu-card">
                    <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                        <circle cx="8.5" cy="8.5" r="1.5"></circle>
                        <polyline points="21 15 16 10 5 21"></polyline>
                        <path d="M12 12l4 4-4 4" transform="translate(4, 0) scale(0.6)"></path>
                    </svg>
                    <span data-i18n="gen_animation">Animar Personaje (IA Video)</span>
                </button>
                <button type="button" onclick="window.location.href='audio.html'" class="menu-card">
                    <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-mic"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="23"></line><line x1="8" y1="23" x2="16" y2="23"></line></svg>
                    <span data-i18n="gen_sound">Generar Sonido con IA</span>
                </button>
                <button id="text-to-sprite-btn" class="menu-card coming-soon" disabled>
                    <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-type"><polyline points="4 7 4 4 20 4 20 7"></polyline><line x1="9" y1="20" x2="15" y2="20"></line><line x1="12" y1="4" x2="12" y2="20"></line></svg>
                    <span data-i18n="gen_text">Generar Sprite a partir de Texto</span>
                </button>
            </div>
            <div style="text-align: center; margin-top: 2rem; display: flex; justify-content: center; gap: 15px; flex-wrap: wrap;">
                <button type="button" onclick="window.location.href='previsualizacion.html'" class="pill-btn highlight-btn" style="padding: 12px 24px;">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-play"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
                    <span data-i18n="preview_anim">Previsualizar Animación</span>
                </button>
                <button type="button" onclick="window.location.href='historial.html'" class="pill-btn highlight-btn" style="padding: 12px 24px; background: rgba(255,255,255,0.1);">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-clock"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
                    <span data-i18n="history">Historial</span>
                </button>
            </div>
        </section>
    </div>

    <div id="toast-container"></div>

    <div id="notif-modal" class="modal hidden">
        <div class="modal-content">
            <h2 data-i18n="notifications">Notificaciones</h2>
            <div id="notif-list" style="text-align: left; margin-bottom: 20px;">
                <p style="text-align: center; opacity: 0.6;">No hay notificaciones nuevas</p>
            </div>
            <button type="button" id="close-notif-modal" class="pill-btn" style="margin: 0 auto;" data-i18n="close">Cerrar</button>
        </div>
    </div>
    <iframe id="sso-bridge" src="https://carleystudio.com/bridge.html" style="display:none;"></iframe>

    <script src="script.js"></script>
    <footer>
        <div class="footer-links">
            <a href="https://www.facebook.com/profile.php?id=61575555791348" target="_blank" data-i18n="community">Comunidad</a>
            <a href="https://carleystudio.com/vid-spri.html#donations" target="_blank" data-i18n="support">Apoyar</a>
            <a href="creditos.html" data-i18n="credits">Créditos</a>
            <a href="privacidad.html" data-i18n="privacy">Privacidad</a>
        </div>
        <div class="copyright">
            © 2026 Carley Interactive Studio.
        </div>
    </footer>
</body>
</html>
