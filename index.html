<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VidSpri - Video to Sprite</title>
    <meta name="description" content="VidSpri: Crea hojas de sprites y animaciones para tus videojuegos en segundos">

    <!-- Translation Dictionary -->
    <script src="config.js"></script>
    <script src="translations.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="logo.png" type="image/png">
</head>
<body>
    <div class="header-actions">
        <button type="button" onclick="window.location.href='ayuda.html'" class="pill-btn">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-help-circle"><circle cx="12" cy="12" r="10"></circle><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>
            <span data-i18n="help">Ayuda</span>
        </button>
        <div class="header-right-controls">
            <button type="button" onclick="window.location.href='configuracion.html'" class="pill-btn">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-settings"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
                <span data-i18n="config">Configuración</span>
            </button>
        </div>
    </div>

    <div class="container">
        <h1>
            <img src="logo.png" alt="VidSpri Logo" class="logo">
            <span data-i18n="title">VidSpri</span>
        </h1>
        <p data-i18n="subtitle">Convierte tus videos de animaciones en hojas de sprites listas para usar.</p>

        <!-- Main Menu -->
        <section id="main-menu">
            <div class="main-menu-grid">
                <button id="video-sprite-btn" class="menu-card">
                    <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-camera"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path><circle cx="12" cy="13" r="4"></circle></svg>
                    <span data-i18n="gen_video">Generar Sprite a partir de Video</span>
                </button>
                <button id="image-sprite-btn" class="menu-card coming-soon" disabled>
                    <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-layers"><polygon points="12 2 2 7 12 12 22 7 12 2"></polygon><polyline points="2 17 12 22 22 17"></polyline><polyline points="2 12 12 17 22 12"></polyline></svg>
                    <span data-i18n="gen_imgs">Generar Sprite a partir de Imágenes</span>
                </button>
                <button id="sound-generation-btn" class="menu-card coming-soon" disabled>
                    <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-mic"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="23"></line><line x1="8" y1="23" x2="16" y2="23"></line></svg>
                    <span data-i18n="gen_sound">Generar Sonido con IA</span>
                </button>
                <button id="text-to-sprite-btn" class="menu-card coming-soon" disabled>
                    <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-type"><polyline points="4 7 4 4 20 4 20 7"></polyline><line x1="9" y1="20" x2="15" y2="20"></line><line x1="12" y1="4" x2="12" y2="20"></line></svg>
                    <span data-i18n="gen_text">Generar Sprite a partir de Texto</span>
                </button>
            </div>
            <div style="text-align: center; margin-top: 1.5rem;">
                <button type="button" id="sprite-preview-btn" class="text-button" data-i18n="preview_anim">Previsualizar Animación</button>
            </div>
        </section>

        <!-- Video Processing Section -->
        <section id="video-section" class="hidden">
             <h2 data-i18n="gen_video">Generar Sprite a partir de Video</h2>
            <form id="sprite-form">
                <div class="form-group">
                    <label data-i18n="step1_video">1. Sube tu archivo de video:</label>
                    <div id="drag-drop-area-video" class="drag-drop-area">
                        <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-upload-cloud"><polyline points="16 16 12 12 8 16"></polyline><line x1="12" y1="12" x2="12" y2="21"></line><path d="M20.39 18.39A5 5 0 0 0 18 9h-1.26A8 8 0 1 0 3 16.3"></path></svg>
                        <p id="file-status" data-i18n="drag_drop">Arrastra y suelta tu video aquí o haz clic</p>
                        <button type="button" id="custom-file-btn" class="pill-btn" data-i18n="choose_file">Seleccionar Archivo</button>
                        <input type="file" id="video-file" name="video_file" accept="video/*" class="hidden" required>
                    </div>
                </div>

                <div id="video-preview-container" class="hidden">
                    <video id="video-preview" controls></video>
                    <div class="time-range-controls">
                        <button type="button" id="mark-start-btn" class="pill-btn" data-i18n="mark_start">Marcar Inicio</button>
                        <button type="button" id="mark-end-btn" class="pill-btn" data-i18n="mark_end">Marcar Fin</button>
                    </div>
                </div>

                <div class="form-group">
                    <label for="frames" data-i18n="step2_frames">2. Elige el número de fotogramas:</label>
                    <input type="number" id="frames" name="frames" min="1" max="100" value="12" required>
                </div>

                <div class="form-group">
                    <label data-i18n="step3_range">3. Rango del video (opcional):</label>
                    <div class="time-range-selection">
                        <input type="checkbox" id="full-video-checkbox" checked>
                        <label for="full-video-checkbox" data-i18n="full_video">Usar video completo</label>
                    </div>
                    <div id="time-range-inputs" class="hidden">
                         <div class="time-input-group">
                            <label for="start-time">Inicio</label>
                            <input type="number" id="start-time" step="0.1" value="0">
                        </div>
                        <div class="time-input-group">
                            <label for="end-time">Fin</label>
                            <input type="number" id="end-time" step="0.1">
                        </div>
                    </div>
                </div>

                <button type="button" id="extract-frames-btn" class="action-btn" data-i18n="extract_btn">Extraer Fotogramas 📸</button>
            </form>
        </section>

        <section id="frame-preview-container" class="hidden">
            <h2 data-i18n="preview_anim">Vista Previa</h2>
            <div id="frames-output"></div>
            <button type="button" id="generate-sprite-btn" class="action-btn" data-i18n="process_btn">Quitar Fondo y Generar Sprite ✨</button>
        </section>

        <section id="progress-container" class="hidden">
            <p id="progress-text" data-i18n="processing">Procesando...</p>
            <div class="progress-bar">
                <div id="progress-bar-inner"></div>
            </div>
        </section>

        <section id="result-container" class="hidden">
            <h2 data-i18n="done">¡Listo!</h2>
            <img id="sprite-image" src="" alt="Sprite Sheet">
            <div class="result-actions">
                <a id="download-link" href="" download="sprite.png" class="action-btn" style="text-decoration:none;">Descargar</a>
            </div>
        </section>

        <div id="error-message" class="hidden">
            <p>Error.</p>
        </div>
    </div>

    <div id="toast-container"></div>

    <!-- SSO Bridge -->
    <iframe id="sso-bridge" src="https://carleystudio.com/bridge.html" style="display:none;"></iframe>

    <script src="script.js"></script>
    <footer>
        <div class="footer-links">
            <a href="https://www.facebook.com/profile.php?id=61575555791348" target="_blank" data-i18n="community">Comunidad</a>
            <a href="https://www.paypal.com/donate/?hosted_button_id=SF9TB2TJLYL96" target="_blank" data-i18n="support">Apoyar</a>
            <a href="creditos.html" data-i18n="credits">Créditos</a>
        </div>
        <div class="copyright">
            © 2025 VidSpri.
        </div>
    </footer>
</body>
</html>
