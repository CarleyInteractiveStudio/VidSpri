<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Previsualizar Animación - VidSpri</title>
    <script src="config.js"></script>
    <script src="translations.js"></script>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="logo.png" type="image/png">
    <style>
        .preview-area {
            background: radial-gradient(circle at center, rgba(112, 0, 255, 0.1) 0%, rgba(0, 0, 0, 0.6) 100%);
            border-radius: 32px;
            padding: 4rem;
            margin-bottom: 2.5rem;
            min-height: 450px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            border: 1px solid rgba(0, 242, 255, 0.2);
            box-shadow:
                inset 0 0 80px rgba(0,0,0,0.8),
                0 10px 40px rgba(0,0,0,0.4);
            overflow: hidden;
            backdrop-filter: blur(20px);
            image-rendering: -webkit-optimize-contrast;
            image-rendering: -moz-crisp-edges;
            image-rendering: -o-crisp-edges;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }
        .preview-area::before {
            content: '';
            position: absolute;
            width: 150%;
            height: 150%;
            background: conic-gradient(from 0deg at 50% 50%, transparent, rgba(0, 242, 255, 0.05), transparent);
            animation: rotate 10s linear infinite;
            pointer-events: none;
        }
        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        #anim-canvas {
            image-rendering: -webkit-optimize-contrast;
            image-rendering: -moz-crisp-edges;
            image-rendering: -o-crisp-edges;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            -ms-interpolation-mode: nearest-neighbor;
            filter: drop-shadow(0 10px 20px rgba(0,0,0,0.5));
            transition: transform 0.2s ease;
            display: block;
            margin: 0 auto;
        }
        .controls-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }
        .history-section {
            margin-top: 3rem;
            text-align: center;
        }
        .history-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 15px;
            margin-top: 1.5rem;
        }
        .history-item {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }
        .history-item:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-3px);
            border-color: var(--primary);
        }
        .history-item img {
            width: 100%;
            height: 80px;
            object-fit: contain;
            image-rendering: pixelated;
        }
        .history-item span {
            font-size: 0.7rem;
            opacity: 0.6;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 100%;
        }
    </style>

    <!-- Social Media Metadata -->
    <meta property="og:title" content="Previsualizar Animación - VidSpri">
    <meta property="og:description" content="VidSpri: Crea hojas de sprites y animaciones para tus videojuegos en segundos">
    <meta property="og:image" content="https://vidspri.online/logo.png">
    <meta property="og:url" content="https://vidspri.online/previsualizacion.html">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Previsualizar Animación - VidSpri">
    <meta name="twitter:description" content="VidSpri: Crea hojas de sprites y animaciones para tus videojuegos en segundos">
    <meta name="twitter:image" content="https://vidspri.online/logo.png">
</head>
<body>
    <div class="header-actions">
        <button type="button" onclick="window.location.href='index.html'" class="pill-btn">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-arrow-left"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
            <span data-i18n="back">Volver</span>
        </button>
    </div>

    <div class="container">
        <h1 data-i18n="preview_anim">Previsualizar Animación</h1>

        <div id="upload-stage">
            <div id="drag-drop-area-sprite" class="drag-drop-area">
                <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-image"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
                <p data-i18n="drag_drop">Arrastra tu hoja de sprites aquí</p>
                <button type="button" class="pill-btn" onclick="document.getElementById('sprite-file').click()" data-i18n="choose_file">Seleccionar Archivo</button>
                <input type="file" id="sprite-file" accept="image/*" class="hidden">
            </div>

            <div id="history-container" class="history-section hidden">
                <h3 style="font-size: 1.2rem; margin-bottom: 1rem; color: var(--primary);" data-i18n="recent_history">Historial Reciente</h3>
                <div id="history-grid" class="history-grid">
                    <!-- History items will be injected here -->
                </div>
            </div>
        </div>

        <div id="preview-stage" class="hidden">
            <div class="preview-area">
                <canvas id="anim-canvas"></canvas>
            </div>

            <div style="text-align: center; margin-bottom: 20px;">
                <a id="download-sprite-link" href="#" download="sprite.png" class="pill-btn highlight-btn" style="display: inline-flex; text-decoration: none;">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-download"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                    <span data-i18n="download_sprite">Descargar Sprite</span>
                </a>
            </div>

            <div style="text-align: center; margin-bottom: 20px;">
                <button type="button" class="pill-btn" onclick="resetUpload()">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-upload"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
                    <span data-i18n="load_other">Cargar otro Sprite</span>
                </button>
            </div>


            <div id="manual-adjust-card" class="modern-card hidden">
                <h3 data-i18n="manual_adjust">Ajuste Manual (Recortar)</h3>
                <p class="small-text" style="margin-bottom: 15px; opacity: 0.8;" data-i18n="manual_adjust_desc">Indica cuántas columnas y filas tiene tu hoja de sprites.</p>
                <div class="controls-grid">
                    <div class="form-group">
                        <label data-i18n="cols">Columnas</label>
                        <input type="number" id="cols-input" value="1" min="1" style="width: 100%;">
                    </div>
                    <div class="form-group">
                        <label data-i18n="rows">Filas</label>
                        <input type="number" id="rows-input" value="1" min="1" style="width: 100%;">
                    </div>
                </div>
                <button type="button" class="action-btn" id="apply-btn" data-i18n="apply">Aplicar</button>
            </div>

            <div id="export-card" class="modern-card hidden" style="margin-top: 20px; text-align: left;">
                <h3 style="color: var(--primary); margin-bottom: 15px;" data-i18n="export_settings">Ajustes de Exportación</h3>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; align-items: start;">
                    <div>
                        <div class="form-group" style="display: flex; align-items: center; gap: 10px; margin-bottom: 15px;">
                            <input type="checkbox" id="pixel-art-check" checked style="width: 20px; height: 20px; accent-color: var(--primary);">
                            <label for="pixel-art-check" style="margin: 0; color: white; font-size: 0.9rem;" data-i18n="pixel_art_mode">Modo Pixel Art</label>
                        </div>

                        <div class="export-size-control">
                            <label for="export-size" style="display: block; font-size: 0.8rem; margin-bottom: 5px; opacity: 0.8;" data-i18n="size_per_frame">Tamaño por cuadro:</label>
                            <div style="display: flex; gap: 10px; align-items: center;">
                                <select id="export-size" class="custom-select" style="flex: 1;">
                                    <option value="original" selected data-i18n="original">Original</option>
                                    <option value="16">16 x 16</option>
                                    <option value="32">32 x 32</option>
                                    <option value="64">64 x 64</option>
                                    <option value="custom">Personalizado</option>
                                </select>
                            </div>
                            <div id="custom-size-inputs" class="hidden" style="display: flex; gap: 5px; align-items: center; margin-top: 10px;">
                                <input type="number" id="custom-width" value="32" min="8" max="512" style="width: 60px; padding: 8px; background: rgba(0,0,0,0.3); border: 1px solid var(--glass-border); border-radius: 8px; color: white;">
                                <span style="color: white; opacity: 0.5;">x</span>
                                <input type="number" id="custom-height" value="32" min="8" max="512" style="width: 60px; padding: 8px; background: rgba(0,0,0,0.3); border: 1px solid var(--glass-border); border-radius: 8px; color: white;">
                            </div>
                        </div>

                        <div class="form-group" style="margin-top: 15px;">
                            <label for="export-scale" style="font-size: 0.8rem; margin-bottom: 5px; opacity: 0.8;" data-i18n="export_scale">Escala de exportación (Upscale):</label>
                            <select id="export-scale" class="custom-select" style="width: 100%;">
                                <option value="1">1x (Original)</option>
                                <option value="2">2x</option>
                                <option value="4">4x</option>
                                <option value="8">8x</option>
                            </select>
                        </div>
                    </div>
                    <div style="display: flex; flex-direction: column; justify-content: center; height: 100%;">
                        <button type="button" id="final-download-btn" class="action-btn" style="margin: 0;">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                            <span data-i18n="download_final_sprite">Descargar Sprite Final</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const spriteInput = document.getElementById('sprite-file');
        const canvas = document.getElementById('anim-canvas');
        const ctx = canvas.getContext('2d');
        let spriteImg = new Image();
        let cols = 1, rows = 1, currentFrame = 0;
        let animInterval;
        let currentHistoryItem = null;

        document.addEventListener('DOMContentLoaded', () => {
            const currentLang = localStorage.getItem('vidspri_lang') || 'es';
            applyTranslations(currentLang);
            loadHistory();

            // Check for automatically passed sprite
            const savedSprite = localStorage.getItem('vidspri_last_sprite');
            if (savedSprite) {
                cols = parseInt(localStorage.getItem('vidspri_last_cols')) || 1;
                rows = parseInt(localStorage.getItem('vidspri_last_rows')) || 1;

                loadSprite(savedSprite, cols, rows);
            }
        });

        async function loadHistory() {
            const dbName = "VidSpriHistory";
            const request = indexedDB.open(dbName, 1);
            request.onsuccess = (e) => {
                const db = e.target.result;
                if (!db.objectStoreNames.contains('history')) return;
                const tx = db.transaction('history', 'readonly');
                const store = tx.objectStore('history');
                const getReq = store.getAll();
                getReq.onsuccess = () => {
                    const items = getReq.result.filter(i => i.type === 'sprite').reverse().slice(0, 8);
                    if (items.length > 0) {
                        document.getElementById('history-container').classList.remove('hidden');
                        const grid = document.getElementById('history-grid');
                        grid.innerHTML = '';
                        items.forEach(item => {
                            const div = document.createElement('div');
                            div.className = 'history-item';
                            div.onclick = () => {
                                currentHistoryItem = item;
                                loadSprite(item.dataUrl, item.metadata?.cols || 1, item.metadata?.rows || 1);
                            };
                            const img = document.createElement('img');
                            img.src = item.dataUrl;
                            const span = document.createElement('span');
                            span.textContent = new Date(item.timestamp).toLocaleString();
                            div.appendChild(img);
                            div.appendChild(span);
                            grid.appendChild(div);
                        });
                    }
                };
            };
        }

        function loadSprite(src, c, r) {
            cols = c;
            rows = r;
            spriteImg.onload = () => {
                document.getElementById('upload-stage').classList.add('hidden');
                document.getElementById('preview-stage').classList.remove('hidden');
                document.getElementById('cols-input').value = cols;
                document.getElementById('rows-input').value = rows;
                document.getElementById('download-sprite-link').href = src;

                // Hide manual adjustment if metadata is already present and valid
                if (cols > 1 || rows > 1) {
                    document.getElementById('manual-adjust-card').classList.add('hidden');
                } else {
                    document.getElementById('manual-adjust-card').classList.remove('hidden');
                }
                document.getElementById('export-card').classList.remove('hidden');

                startAnimation();
            };
            spriteImg.src = src;
        }

        spriteInput.onchange = (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (event) => {
                    const dataUrl = event.target.result;
                    loadSprite(dataUrl, 1, 1);
                    // Save to history so it persists and metadata can be updated
                    saveToHistory(dataUrl, 1, 1);
                };
                reader.readAsDataURL(file);
            }
        };

        async function saveToHistory(dataUrl, c, r) {
            const dbName = "VidSpriHistory";
            const request = indexedDB.open(dbName, 1);
            request.onupgradeneeded = (e) => {
                const db = e.target.result;
                if (!db.objectStoreNames.contains('history')) {
                    db.createObjectStore('history', { keyPath: 'id', autoIncrement: true });
                }
            };
            request.onsuccess = (e) => {
                const db = e.target.result;
                const tx = db.transaction('history', 'readwrite');
                const store = tx.objectStore('history');
                const addReq = store.add({
                    type: 'sprite',
                    dataUrl: dataUrl,
                    prompt: "Uploaded Sprite",
                    timestamp: Date.now(),
                    metadata: { cols: c, rows: r }
                });
                addReq.onsuccess = (ev) => {
                    currentHistoryItem = { id: ev.target.result, dataUrl, metadata: { cols: c, rows: r } };
                    loadHistory(); // Refresh grid
                };
            };
        }

        function autoDetectFrames() {
            // Very simple auto-detection: assume 1 row if image is very wide
            if (spriteImg.width > spriteImg.height * 2) {
                cols = Math.round(spriteImg.width / spriteImg.height);
                rows = 1;
            } else {
                cols = 1;
                rows = 1;
            }
            document.getElementById('cols-input').value = cols;
            document.getElementById('rows-input').value = rows;
        }

        function startAnimation() {
            if (animInterval) clearInterval(animInterval);
            animInterval = setInterval(() => {
                drawFrame();
                currentFrame = (currentFrame + 1) % (cols * rows);
            }, 100);
        }

        function drawFrame() {
            if (!spriteImg.complete) return;
            const frameW = Math.floor(spriteImg.width / cols);
            const frameH = Math.floor(spriteImg.height / rows);
            const col = currentFrame % cols;
            const row = Math.floor(currentFrame / cols);

            canvas.width = frameW;
            canvas.height = frameH;

            // Automatic clean integer scaling
            const maxDimension = 400; // slightly bigger for better presence
            let scale = 1;
            if (frameW > 0 && frameH > 0) {
                const targetScale = Math.min(maxDimension / frameW, maxDimension / frameH);
                scale = Math.max(1, Math.floor(targetScale));
                if (scale > 10) scale = 10; // Cap it
            }

            canvas.style.width = Math.floor(frameW * scale) + 'px';
            canvas.style.height = Math.floor(frameH * scale) + 'px';

            ctx.imageSmoothingEnabled = false;
            ctx.imageSmoothingQuality = 'low';

            ctx.clearRect(0, 0, frameW, frameH);
            ctx.drawImage(spriteImg,
                Math.floor(col * (spriteImg.width / cols)),
                Math.floor(row * (spriteImg.height / rows)),
                frameW, frameH, 0, 0, frameW, frameH);
        }

        document.getElementById('apply-btn').onclick = () => {
            cols = parseInt(document.getElementById('cols-input').value) || 1;
            rows = parseInt(document.getElementById('rows-input').value) || 1;
            currentFrame = 0;

            // Save metadata update
            localStorage.setItem('vidspri_last_cols', cols);
            localStorage.setItem('vidspri_last_rows', rows);

            if (currentHistoryItem) {
                updateHistoryMetadata(currentHistoryItem.id, cols, rows);
            }
        };

        document.getElementById('export-size').onchange = () => {
            document.getElementById('custom-size-inputs').classList.toggle('hidden', document.getElementById('export-size').value !== 'custom');
        };

        document.getElementById('final-download-btn').onclick = async () => {
            if (!spriteImg.complete) return;

            const pixelArtMode = document.getElementById('pixel-art-check').checked;
            const sizeMode = document.getElementById('export-size').value;
            const scale = parseInt(document.getElementById('export-scale').value) || 1;

            const srcFrameW = spriteImg.width / cols;
            const srcFrameH = spriteImg.height / rows;

            let frameBaseW = srcFrameW;
            let frameBaseH = srcFrameH;

            if (sizeMode === '16') { frameBaseW = 16; frameBaseH = 16; }
            else if (sizeMode === '32') { frameBaseW = 32; frameBaseH = 32; }
            else if (sizeMode === '64') { frameBaseW = 64; frameBaseH = 64; }
            else if (sizeMode === 'custom') {
                frameBaseW = parseInt(document.getElementById('custom-width').value) || 32;
                frameBaseH = parseInt(document.getElementById('custom-height').value) || 32;
            }

            const targetW = Math.round(frameBaseW * scale);
            const targetH = Math.round(frameBaseH * scale);

            const exportCanvas = document.createElement('canvas');
            exportCanvas.width = targetW * cols;
            exportCanvas.height = targetH * rows;
            const eCtx = exportCanvas.getContext('2d');

            if (pixelArtMode) {
                eCtx.imageSmoothingEnabled = false;
                eCtx.imageSmoothingQuality = 'low';
            }

            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    if (sizeMode === 'original' && scale === 1) {
                        eCtx.drawImage(
                            spriteImg,
                            c * srcFrameW, r * srcFrameH, srcFrameW, srcFrameH,
                            c * targetW, r * targetH, targetW, targetH
                        );
                    } else {
                        // Centering logic with Scale factor
                        const scaledSrcW = Math.round(srcFrameW * scale);
                        const scaledSrcH = Math.round(srcFrameH * scale);

                        if (scaledSrcW > targetW || scaledSrcH > targetH) {
                            // Scale down to fit the target frame box
                            const ratio = Math.min(targetW / scaledSrcW, targetH / scaledSrcH);
                            const finalW = Math.round(scaledSrcW * ratio);
                            const finalH = Math.round(scaledSrcH * ratio);
                            const offX = c * targetW + Math.floor((targetW - finalW) / 2);
                            const offY = r * targetH + Math.floor((targetH - finalH) / 2);
                            eCtx.drawImage(
                                spriteImg,
                                c * srcFrameW, r * srcFrameH, srcFrameW, srcFrameH,
                                offX, offY, finalW, finalH
                            );
                        } else {
                            // Center it
                            const offX = c * targetW + Math.floor((targetW - scaledSrcW) / 2);
                            const offY = r * targetH + Math.floor((targetH - scaledSrcH) / 2);
                            eCtx.drawImage(
                                spriteImg,
                                c * srcFrameW, r * srcFrameH, srcFrameW, srcFrameH,
                                offX, offY, scaledSrcW, scaledSrcH
                            );
                        }
                    }
                }
            }

            const link = document.createElement('a');
            link.download = `sprite_${targetW}x${targetH}_${scale}x.png`;
            link.href = exportCanvas.toDataURL('image/png');
            link.click();

            // Metadata download
            downloadMetadataFile(frameBaseW, frameBaseH, cols, rows, scale);
        };

        async function updateHistoryMetadata(id, c, r) {
            const dbName = "VidSpriHistory";
            const request = indexedDB.open(dbName, 1);
            request.onsuccess = (e) => {
                const db = e.target.result;
                const tx = db.transaction('history', 'readwrite');
                const store = tx.objectStore('history');
                const getReq = store.get(id);
                getReq.onsuccess = () => {
                    const item = getReq.result;
                    if (item) {
                        item.metadata = { cols: c, rows: r };
                        store.put(item);
                    }
                };
            };
        }

        function resetUpload() {
            if (animInterval) clearInterval(animInterval);
            localStorage.removeItem('vidspri_last_sprite');
            localStorage.removeItem('vidspri_last_cols');
            localStorage.removeItem('vidspri_last_rows');
            window.location.reload();
        }

        function applyTranslations(lang) {
            const dict = window.translations[lang] || window.translations['es'];
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (dict[key]) el.textContent = dict[key];
            });
        }

        function downloadMetadataFile(w, h, c, r, s) {
            const content = `VidSpri - Sprite Metadata
---------------------------
Frame Width: ${w}
Frame Height: ${h}
Columns: ${c}
Rows: ${r}
Export Scale: ${s}x
Final Frame Width: ${Math.round(w * s)}
Final Frame Height: ${Math.round(h * s)}

Generated by VidSpri.com`;
            const blob = new Blob([content], { type: 'text/plain' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = 'README_SPRITE.txt';
            link.click();
        }
    </script>
</body>
</html>
